<!doctype html><meta charset="utf-8">
<title>Nova harness — Nodes 2.0 layout</title>
<style>
  html,body{margin:0;background:#2b2b3a;font:12px system-ui;color:#ccc}
  /* Mirrors how ComfyUI's Vue node renderer (Nodes 2.0) hosts a DOM widget,
     from ComfyUI_frontend WidgetGrid.vue / WidgetDOM.vue:
       - the whole node pane is zoomed with a scale3d transform;
       - widgets sit in a 3-column grid, one subgrid row each; a DOM widget
         has computeLayoutSize, so its row is "auto" and takes the leftover;
       - WidgetDOM mounts the element in `flex flex-col *:flex-1`. */
  #pane{position:absolute;top:10px;left:10px;transform-origin:0 0}
  .node{width:900px;height:560px;display:flex;flex-direction:column;background:#353545;border-radius:8px}
  .title{height:30px;flex:none}
  .grid{display:grid;grid-template-columns:min-content minmax(80px,min-content) minmax(125px,1fr);
        grid-template-rows:min-content min-content auto;row-gap:4px;padding-right:12px;flex:1;min-height:0}
  .row{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:stretch}
  .slot{width:12px}
  .lbl{white-space:nowrap;padding:4px}
  .inp{background:#222;min-height:24px}
  .dom{grid-column:span 2;display:flex;flex-direction:column}
  .dom > *{flex:1 1 0%}
  /* ?foreign=1 — a page-wide rule overriding canvas size, as some stylesheet
     under Nodes 2.0 does. It drove the old render scale into a runaway loop. */
  .foreign canvas{width:auto !important;height:auto !important}
</style>
<div id="pane"><div class="node">
  <div class="title">Nova Player</div>
  <div class="grid">
    <div class="row"><div class="slot"></div><div class="lbl">panel_format</div><div class="inp"></div></div>
    <div class="row"><div class="slot"></div><div class="lbl">context</div><div class="inp"></div></div>
    <div class="row"><div class="slot"></div><div class="dom" id="stage"></div></div>
  </div>
</div></div>
<script type="module">
if (new URLSearchParams(location.search).get("foreign")) document.getElementById("pane").classList.add("foreign");
import { config } from "/web/core/config.js";
import { PlayerHost } from "/web/core/host.js";
import { RENDERER_IDS } from "/web/renderers/registry.js";
await config.load();

const N = 120, ch0 = [], ch1 = [];
for (let i = 0; i < N; i++) {
  const env = 0.35 + 0.55 * Math.abs(Math.sin(i / 9));
  ch0.push(Math.min(1, env * (1 + 0.3 * Math.sin(i * 1.7))));
  ch1.push(Math.min(1, env * (1 + 0.3 * Math.cos(i * 1.3))));
}
const node = { id: 1, size: [900,560], properties: {}, graph:{_version:0},
               setSize(s){this.size=s;}, addDOMWidget(){return {};} };
const host = new PlayerHost(node, { filename:"t.wav", duration:180, sample_rate:48000,
                                    stereo:true, lufs:-18.4, peaks:{ch0,ch1} });
document.getElementById("stage").appendChild(host.element);

// Stub the media element so play/pause is observable without a real file.
let playing = false;
host.engine.play  = () => { playing = true;  host.markDirty(); return Promise.resolve(); };
host.engine.pause = () => { playing = false; host.markDirty(); };
host.engine.toggle = () => playing ? host.engine.pause() : host.engine.play();
Object.defineProperty(host.engine, "playing", { get: () => playing });
host.engine.update = () => Object.assign(host.engine.sig,
  { playing, currentTime: 60, duration: 180, progress: 60/180 });

window.__host = host;
window.__setZoom = z => { document.getElementById("pane").style.transform = `scale3d(${z},${z},1)`; };
window.__isPlaying = () => playing;
window.__modes = RENDERER_IDS;
window.__ready = true;
</script>
