<!doctype html><meta charset="utf-8">
<title>Nova harness — zoom</title>
<style>
  html,body{margin:0;background:#2b2b3a;font:12px system-ui}
  /* Reproduces how ComfyUI positions a DOM widget: a CSS transform for graph
     zoom on an ancestor. The layout size never changes; the on-screen size does. */
  #zoomer{position:absolute;top:20px;left:20px;transform-origin:0 0}
  #stage{position:relative;width:900px;height:280px}
</style>
<div id="zoomer"><div id="stage"></div></div>
<script type="module">
import { config } from "/web/core/config.js";
import { PlayerHost } from "/web/core/host.js";
import { RENDERER_IDS } from "/web/renderers/registry.js";
await config.load();

const N = 120, ch0 = [], ch1 = [];
for (let i = 0; i < N; i++) {
  const env = 0.35 + 0.55 * Math.abs(Math.sin(i / 9));
  ch0.push(Math.min(1, env * (1 + 0.3 * Math.sin(i * 1.7))));
  ch1.push(Math.min(1, env * (1 + 0.3 * Math.cos(i * 1.3))));
}
const node = { id: 1, size: [900,280], properties: {}, graph:{_version:0},
               setSize(s){this.size=s;}, addDOMWidget(){return {};} };
const host = new PlayerHost(node, { filename:"t.wav", duration:180, sample_rate:48000,
                                    stereo:true, lufs:-18.4, peaks:{ch0,ch1} });
document.getElementById("stage").appendChild(host.element);

// Stub the media element so play/pause is observable without a real file.
let playing = false;
host.engine.play  = () => { playing = true;  host.markDirty(); return Promise.resolve(); };
host.engine.pause = () => { playing = false; host.markDirty(); };
host.engine.toggle = () => playing ? host.engine.pause() : host.engine.play();
Object.defineProperty(host.engine, "playing", { get: () => playing });
host.engine.update = () => Object.assign(host.engine.sig,
  { playing, currentTime: 60, duration: 180, progress: 60/180 });

window.__host = host;
window.__setZoom = z => { document.getElementById("zoomer").style.transform = `scale(${z})`; };
window.__isPlaying = () => playing;
window.__modes = RENDERER_IDS;
window.__ready = true;
</script>
