[project]
name = "comfyui-novaaudioplayer"
description = "Twenty-eight nodes for making music with ACE-Step, from generation parameters through mastering to tagged delivery, plus LoRA training. Generation & Synthesis: Madow Inputs gathers every ACE-Step parameter in one node with named presets, cross-field validation and a context blob recording exactly what produced a take; Madow Unpack fans that bundle out into typed outputs. Analysis & Validation: Nova Player, an audio player with twelve live visualisers and a whole-file BS.1770 measurement panel; a release-safety validator; a track inspector; and speech-to-text transcription with optional vocal isolation. Mastering Process: corrective mastering with per-stage rollback and a reproduction fingerprint. Data Viewers: in-canvas report viewers for mastering, inspection and lyrics. Delivery & Metadata: read tag data from SQLite, write it onto a batch of files, read it back to verify, render reports to images, and save 24-bit FLAC or PCM16/PCM24/float32 WAV. Utility & IO: single and batch audio loaders, a path and profile manager, a console, a MySQL workflow logger and a RAM/VRAM probe. LoRA Training: build a labelled dataset from tagged audio, generate ACE-Step training tensors, and run ACE-Step's LoRA training loop as a cancellable child process — this requires a separate ACE-Step 1.5 install and its checkpoints, and installs and downloads nothing. Verified on Linux/ROCm; Windows, macOS and CUDA are untested."
version = "2.5.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"

# Only genuinely required imports are listed, per the Comfy Registry rule that
# dependencies be declared rather than installed at runtime.
#
#   mutagen  - Nova Tag Writer and Nova Tag Reader cannot function without it;
#              there is no degraded mode to fall back to.
#   pymysql  - the same, for Nova SQL Dump. Pure Python and small, so declaring
#              it costs an install nothing meaningful.
#
# DECLARING IS NOT THE SAME AS BEING PRESENT, which is why neither of these is
# imported at module scope. Declaring covers the registry and ComfyUI-Manager
# install paths; it does nothing for the very common one where somebody clones
# this repository straight into custom_nodes and never runs pip. On that path an
# undeclared-but-imported package is an ImportError in __init__.py, and an
# ImportError in __init__.py takes all twenty-six nodes off the menu over one
# optional feature. Every third-party import in this package is therefore lazy
# or guarded, and fails in words at the point of use.
#
# Deliberately NOT listed:
#   torch, numpy, scipy, av, torchaudio, aiohttp
#              - all in ComfyUI's own requirements.txt, so they are present in
#                any working install. Restating them would only let this package
#                churn versions ComfyUI already pins.
#   soundfile  - NOT shipped by ComfyUI, and deliberately still not declared: it
#                is one of several interchangeable decode backends in the audio
#                loaders, powers the non-WAV download paths in routes.py, and is
#                the first choice in the ACE-Step decode shim. Every one of those
#                falls back to PyAV, which ComfyUI does ship, so declaring
#                soundfile would make a hard dependency out of a preference.
dependencies = [
    "mutagen>=1.45",
    "pymysql>=1.0",
]

classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/NovaFemme/ComfyUI-NovaAudioPlayer"
BugTracker = "https://github.com/NovaFemme/ComfyUI-NovaAudioPlayer/issues"

[tool.comfy]
PublisherId = "novafemme"
DisplayName = "Nova Audio Player"

# Must be a publicly reachable URL, not a repo-relative path — the registry
# fetches it at publish time, so docs/images/icon.png has to be on main before
# the push that publishes. It is a raw main URL: pinning to a commit SHA is not
# possible here, because the SHA does not exist until this file is committed.
# Consequence: replacing icon.png on main changes what a future publish fetches.
# 400x400 square PNG — the registry's stated maximum.
Icon = "https://raw.githubusercontent.com/NovaFemme/ComfyUI-NovaAudioPlayer/main/docs/images/icon.png"

includes = []
