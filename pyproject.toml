[project]
name = "comfyui-novaaudioplayer"
description = "Three nodes for evaluating ACE-Step music generations. Nova Player: an audio player with twelve live visualisers, a whole-file measurement panel, a theme system you can drive from inside the node, and a panel_info output for logging every take's metrics. Madow Inputs: every ACE-Step generation parameter in one node, with named presets, cross-field validation and a context blob that records exactly what produced a take. Madow Unpack: fans that bundle out into typed outputs."
version = "2.3.4"
license = { file = "LICENSE" }
requires-python = ">=3.10"

# Deliberately empty. Every third-party import in this node is lazy and guarded:
#   scipy      - only for the BS.1770 K-weighting filter in compute_lufs();
#                without it the LUFS badge falls back to offset RMS.
#   soundfile  - only for the non-WAV download paths in routes.py.
# Both ship with a standard ComfyUI install. Listing them here would make the
# registry install churn a working environment for features that already
# degrade gracefully.
dependencies = []

classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/NovaFemme/ComfyUI-NovaAudioPlayer"
BugTracker = "https://github.com/NovaFemme/ComfyUI-NovaAudioPlayer/issues"

[tool.comfy]
PublisherId = "novafemme"
DisplayName = "Nova Audio Player"

# Must be a publicly reachable URL, not a repo-relative path — the registry
# fetches it at publish time, so docs/images/icon.png has to be on main before
# the push that publishes. It is a raw main URL: pinning to a commit SHA is not
# possible here, because the SHA does not exist until this file is committed.
# Consequence: replacing icon.png on main changes what a future publish fetches.
# 400x400 square PNG — the registry's stated maximum.
Icon = "https://raw.githubusercontent.com/NovaFemme/ComfyUI-NovaAudioPlayer/main/docs/images/icon.png"

includes = []
