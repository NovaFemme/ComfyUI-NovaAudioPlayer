name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish custom node to the registry
    runs-on: ubuntu-latest

    # The secrets context is not available in a job-level `if`, so the presence
    # of the token is resolved into an env var here and tested per step. Without
    # this the very first push touching pyproject.toml fails — before a
    # publisher account can possibly exist — and leaves a red cross on the repo
    # that means nothing except "not set up yet".
    env:
      HAS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN != '' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Explain the skip
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::notice::REGISTRY_ACCESS_TOKEN is not set — skipping publish."
          echo "To enable publishing:"
          echo "  1. Create a publisher at https://registry.comfy.org"
          echo "     Its ID must match PublisherId in pyproject.toml."
          echo "  2. Add its API key as the repository secret REGISTRY_ACCESS_TOKEN."
          echo "Then bump version in pyproject.toml to cut a release."

      - name: Publish custom node
        if: env.HAS_TOKEN == 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
