<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#1a1420}
  /* The node card, under a CSS transform, exactly as the graph zoom applies one. */
  #zoomer{transform:scale(var(--z,1));transform-origin:0 0}
  #card{position:relative;width:979px;background:#241a2e;border-radius:12px;overflow:hidden}
  #title{height:28px;color:#ddd;font:12px sans-serif;padding:6px}
  #cell{position:relative;width:955px;height:406px;margin:0 12px}
  #foot{height:16px;color:#888;font:10px sans-serif;padding:2px 12px}
</style></head><body>
<div id="zoomer"><div id="card">
  <div id="title">Nova Player</div>
  <div id="cell"></div>
  <div id="foot">comfyui-novaaudioplayer</div>
</div></div>
<script>
/* THE BACKEND, OR ENOUGH OF IT THAT THE CONSOLE STAYS EMPTY.

   Left alone, `config.js` 404s on /nova_player/config, warns once and falls
   back to its built-in theme — the node still draws, by design — and then
   polls /nova_player/config/version every four seconds FOREVER, burying the
   console you opened the harness to read.

   A browser logs a failed request whatever the code does with the rejection,
   so the only way to have a clean console is to not make the request. Hence
   both halves below:

     - /config/version answers 0, the version the snapshot holds, so nothing
       ever re-fetches and the poll never reaches the network.
     - /config answers from the REAL config, either fetched or baked in. Which
       one is decided by where you are serving from, so neither path produces
       a 404: served from the pack root the files are reachable at
       /nova_player/config/, and served from `web/` they are not, so the
       snapshot below is used instead.

   THE SNAPSHOT IS A COPY, taken from nova_player/config/*.json, and copies go
   stale. If you are checking colours, serve the pack root and open
   /web/harness-zoom.html — that path reads the live files and says so. */
(() => {
  const SNAPSHOT = {"status":"success","configVersion":1,"version":0,"baseTheme":"nova-dark","activeTheme":"nova-dark","themes":{"nova-dark":{"label":"Nova Dark","roles":{"surface":"#00000033","text":"#c8c8e8","text.dim":"#cbcbcb","divider":"#ffffff14","wave.idle":"#610042","wave.idle.right":"#4d3221","wave.left":"#6c63ff","wave.left.pulse":"#d9d6ff","wave.right":"#cea12f","wave.right.pulse":"#fff0d6","wave.label":"#232e74","wave.label.bg":"#0000008c","playhead":"#ffffff","btn.bg":"#1a1a7e","btn.active":"#232e74","btn.icon":"#ffffff","scrub.bg":"#bab041","scrub.fill":"#6c63ff","vol.track":"#702525","vol.fill":"#efefef","vol.knob":"#efefef","speaker.muted":"#e05555","hover.glow":"#a89fff","meter.green.lit":"#3ecf5c","meter.green.dim":"#1a2e1e","meter.yellow.lit":"#d4c94a","meter.yellow.dim":"#2a2a1a","meter.red.lit":"#e05555","meter.red.dim":"#2e1a1a","meter.peak":"#ffffff","clip.led":"#ff3b3b","clip.highlight":"#ffb4b4b3","spectrum.fill.low":"#6c63ffaa","spectrum.fill.high":"#cea12f","spectrum.rim":"#ffffff","spectrum.rim.glow":"#ffffff66","spectrum.label.bg":"#00000080","spectrum.label.rule":"#ffffff1a","spectrum.label.text":"#ffffff","gonio.bg":"#00121ceb","gonio.ring":"#00c8ff1f","gonio.ring.outer":"#00c8ff40","gonio.border":"#610042","gonio.grid":"#00c8ff33","gonio.trace":"#00dcffd9","gonio.trace.glow":"#00e6ffb3","gonio.trace.frozen":"#00b4d273","gauge.box.bg":"#00000033","gauge.box.border":"#610042","gauge.needle":"#bbbbbb","gauge.needle.tip":"#ffffff","gauge.pivot":"#ffffff","gauge.title":"#c8c8dc66","gauge.readout.pos":"#aaddaa","gauge.readout.neg":"#ff5555","gauge.seg.green":"#22aa22","gauge.seg.lime":"#88cc00","gauge.seg.yellow":"#cccc00","gauge.seg.orange":"#cc6600","gauge.seg.red":"#cc2222","spectrogram.bg":"#000000","spectrogram.grid":"#ffffff2e","spectrogram.label":"#ffffff80","level.bg":"#1c1c26","level.rms":"#3ecf5c","level.peak":"#ff3b3b","phase.in":"#3ecf5c","phase.out":"#e05555","phase.center":"#ffffff40","band.bass":"#3498db","band.mid":"#2ecc71","band.presence":"#e67e22","band.hf":"#9b59b6","grid.line":"#ffffff1a","spectrum.fill":"#6c63ffaa","guidance.target":"#00e67659","guidance.path":"#29b6f6","guidance.projected":"#29b6f68c","guidance.over":"#e0555540","guidance.under":"#3ecf5c40","guidance.ref":"#ffd54f","guidance.hud.bg":"#05060ceb","bench.bg":"#05060cf2","bench.rule":"#ffffff1f","bench.heading":"#8a93b8","bench.label":"#7d84a3","bench.value":"#dfe4f5","bench.warn":"#ff8a5c","tooltip.bg":"#0b0d18f5","tooltip.border":"#ffffff26","tooltip.text":"#e6e9f7","mode.text":"#ffffff","mode.border":"#ffffff","mode.waveform":"#be5504","mode.eq":"#3a5311","mode.analyzer":"#017da2","mode.spectrogram":"#4b0082","mode.combined":"#1a4a3a","mode.peak_rms":"#1f6f4a","mode.lr_correlation":"#6a3d9a","mode.freq_percentages":"#8a5a1f","mode.combined_suite":"#1a4a6a","mode.fft_analyzer":"#0f5f6f","mode.rta_analyzer":"#5a2d6f","mode.projected_guidance":"#1f4f7f","panel.bg":"#12101acc","panel.surface":"#1b1723","panel.border":"#3d3550","panel.text":"#ede9f2","panel.text.dim":"#847b96","panel.accent":"#6c63ff"},"ramps":{"spectrogram":[[0,"#000000"],[40,"#14003c"],[80,"#500078"],[120,"#b40028"],[160,"#dc2800"],[200,"#ff8c00"],[230,"#ffdc00"],[255,"#ffffff"]]}},"nova-ice":{"label":"Nova Ice","roles":{"surface":"#00060c40","text":"#d8ecf6","text.dim":"#9fb8c4","divider":"#ffffff14","wave.idle":"#123a4a","wave.idle.right":"#134438","wave.left":"#38bdf8","wave.left.pulse":"#e0f6ff","wave.right":"#22d3a7","wave.right.pulse":"#d8fff4","scrub.fill":"#38bdf8","btn.bg":"#0d3b52","btn.active":"#12586f","vol.track":"#123444","tooltip.bg":"#04141df5","tooltip.border":"#38bdf83d","tooltip.text":"#d8ecf6","gonio.border":"#1d5f73","gauge.box.border":"#1d5f73","mode.waveform":"#0e5a72","mode.eq":"#14584a","mode.analyzer":"#1f4f7a","mode.spectrogram":"#2b3f7a","mode.combined":"#155e63","panel.accent":"#38bdf8"},"ramps":{"spectrogram":[[0,"#000000"],[50,"#04203c"],[110,"#0b6d8f"],[170,"#22d3a7"],[215,"#a8f0d8"],[255,"#ffffff"]]}}},"renderers":{"waveform":{"barHeightScale":0.88,"pulseWidth":0.05,"idleAlpha":0.35,"showChannelLabels":true},"spectrum":{"gain":1.0,"noiseFloor":2,"usableBinFraction":0.75,"rimWidth":2.0,"glow":4,"showLabels":true},"analyzer":{"gonioGainMax":3.0,"gonioTarget":0.7,"traceAlpha":0.75,"needleSensitivity":0.25,"corrSmoothing":0.2},"spectrogram":{"gain":1.0,"noiseFloor":4,"usableBinFraction":0.75,"scrollSpeed":60,"showFreqTicks":true},"combined":{"waveformSplit":0.55,"spectrogramWidth":0.28,"spectrumWidth":0.52}},"system":{"appearance":{"color_mixing":"srgb","text_scale":1.0,"bar_relief":0.55,"show_tooltips":true},"audio_engine":{"supported_formats":["wav","flac","ogg"],"default_format":"wav","fft_size":4096,"smoothing_time_constant":0.6,"analyser_fps":30,"share_audio_context":true},"ui_defaults":{"peak_bars":120,"meter_bars":20,"bar_gap":2,"pad_x":14,"meter_gap":6,"time_offset":24,"time_to_scrub_gap":8,"min_node_width":460,"min_node_height":280,"min_widget_height":203,"default_volume":1.0,"default_view_mode":"waveform","peak_hold_ms":300,"settings_button":true,"idle_demo":true}}};

  const fromPackRoot = /^\/web\//.test(location.pathname);
  const real = window.fetch.bind(window);
  const json = (body) => new Response(JSON.stringify(body),
    { status: 200, headers: { "Content-Type": "application/json" } });

  let cached;
  const snapshot = async () => {
    if (cached !== undefined) return cached;
    if (fromPackRoot) {
      try {
        const [colors, system] = await Promise.all([
          real("/nova_player/config/color_config.json").then(r => r.json()),
          real("/nova_player/config/system_config.json").then(r => r.json()),
        ]);
        const { renderers = {}, ...rest } = system;
        cached = { ...SNAPSHOT, activeTheme: colors.activeTheme || SNAPSHOT.activeTheme,
                   themes: colors.themes || SNAPSHOT.themes, renderers, system: rest };
        console.info("[harness] using the live config from /nova_player/config/");
        return cached;
      } catch { /* fall through to the copy */ }
    }
    cached = SNAPSHOT;
    console.info("[harness] using the baked-in config copy — serve the pack root " +
                 "and open /web/harness-zoom.html to read the live files");
    return cached;
  };

  window.fetch = async (input, init) => {
    const url = String(input?.url ?? input);
    if (!url.includes("/nova_player/")) return real(input, init);
    if (url.includes("/config/version")) return json({ version: 0 });
    if (url.endsWith("/config")) return json(await snapshot());
    return real(input, init);
  };
})();
</script>
<script type="module">
import { PlayerHost } from "./core/host.js";
const node = { id: 1, title: "Nova Player", pos: new Float32Array([0, 0]),
               size: new Float32Array([979, 450]), widgets: [],
               setSize(s) { this.size[0] = s[0]; this.size[1] = s[1]; } };
const data = { filename: null, duration: 0, stereo: false, peaks: { ch0: [0] } };
try {
  const host = new PlayerHost(node, data);
  document.getElementById("cell").appendChild(host.element);
  window.__host = host;
  window.__ready = true;
} catch (e) { window.__err = String(e && e.stack || e); }
window.__setZoom = (z) => document.documentElement.style.setProperty("--z", z);
window.__setCell = (w, h) => { const c = document.getElementById("cell");
  c.style.width = w + "px"; c.style.height = h + "px"; };
</script>
</body></html>
